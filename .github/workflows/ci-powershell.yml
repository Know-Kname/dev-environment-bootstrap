name: CI - PowerShell

on:
  push:
    branches: [main]
    paths: ['**/*.ps1', '**/*.psm1']
  pull_request:
    branches: [main]
    paths: ['**/*.ps1', '**/*.psm1']
  workflow_dispatch:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSGallery -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          } else {
            Write-Host "No issues found" -ForegroundColor Green
          }

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $errors += "$($_.Name): $($parseErrors.Count) error(s)"
              $parseErrors | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "Syntax errors found in $($errors.Count) file(s)"
            exit 1
          } else {
            Write-Host "All scripts passed syntax check" -ForegroundColor Green
          }

  validate-json:
    name: Validate JSON Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate JSON template files
        run: |
          errors=0
          for f in $(find . -name '*.json' -o -name '*.template' | grep -v node_modules); do
            if python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "Valid: $f"
            else
              echo "Invalid: $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors invalid file(s)"
            exit 1
          fi
